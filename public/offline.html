<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Barakah Wallet</title>
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/png" href="/images/icons/icon-192x192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: #f0fdfa;
            border: 1px solid #ccfbf1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 20px;
            background: #0d9488;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.15s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #0f766e;
        }
        .brand {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h1>You are currently offline</h1>
        <p>Your connection was interrupted. Please check your internet connection or Wi-Fi to access your Barakah wallet and transactions.</p>
        <button class="btn" onclick="window.location.reload();">Retry Connection</button>
        <div class="brand">Powered by Relic Software</div>
    </div>
</body>
</html>
